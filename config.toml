# dual-author configuration
# ─────────────────────────────────────────────────────────────────────────────
# Edit this file to change which agents author and review issues, concurrency,
# merge policy, and the monitor's timing tunables. Nothing here needs a code
# change — monitor.py reads it at runtime.
#
# Precedence (later overrides earlier):
#   1. built-in DEFAULTS in monitor.py
#   2. this file (skill-wide defaults)
#   3. <repo>/.dual-author.toml           (per-repo override, committable)
#   4. $DUAL_AUTHOR_CONFIG=/path/to.toml   (explicit override)
# A scalar/list replaces; the reviewers list replaces wholesale (not merged).
#
# Inspect the effective config any time:  monitor.py config
# Read one value:                         monitor.py config author.tool


# ── who IMPLEMENTS each issue (the "main authoring") ─────────────────────────
# Owner 2026-09-30: authoring moves to Opus 5.5. Reviewing is unchanged — codex
# gpt-5.6-terra + claude claude-sonnet-5-5 (owner 2026-09-29).
[author]
tool   = "claude"        # "claude" or "codex"
model  = "claude-opus-5-5"
# effort MUST stay empty, not absent: DEFAULTS carries "high", and `--effort high`
# makes the installed claude CLI behind the teamclaude wrapper exit instantly
# (verified — the same command without it answers). Removing the key here lets the
# default through and every lane dies at spawn.
effort = ""
# launch_prefix REPLACES the binary (the wrapper implies claude). Bare `claude`
# draws on THIS machine's own account, which is weekly-limited — it starts, prints
# "You've hit your weekly limit" and sits on a dialog, reported as SPAWN-FAILED.
# The pooled wrapper is the only route past that, and it is what the claude
# reviewer slot has been using all along.
launch_prefix = ["teamclaude", "run", "--auto-fallback", "--"]
# extra_args = ["--foo"] # appended verbatim to the launch argv (escape hatch)

# codex-as-author needs to push, call gh, run dev tools — so it authors with a
# permissive sandbox (a reviewer codex stays locked down; see [[review.reviewers]]).
# To make codex the author, set tool = "codex" above. These apply only then (the
# codex_* keys are kept separate from model/effort so they don't clash with claude):
codex_sandbox  = "danger-full-access"   # or "workspace-write" for network-off, in-tree-only
codex_approval = "never"                # never | on-request | on-failure | untrusted
# Owner 2026-09-29: authors run gpt-6-sol, not gpt-6-astra.
# Probed 2026-07-14 against this machine's login (ChatGPT-plan auth, codex-cli 0.144.4):
#   available: gpt-5.6-sol / gpt-5.6-luna / gpt-5.6-terra (new 5.6 line), gpt-5.5,
#   gpt-5.4, gpt-5.4-mini
#   REJECTED under ChatGPT auth: bare gpt-5.6, every -codex slug (gpt-5.3-codex,
#   gpt-5.2-codex, gpt-5.1-codex-max/-mini), gpt-5, gpt-5.2, gpt-5.5-pro — API-key auth
#   may unlock those; on an API key prefer the -codex line for authoring.
# Re-probed 2026-09-07 (same login): gpt-6-astra is now listed ("Our most capable
#   model for complex, demanding work", efforts low..ultra); 5.6 sol/luna/terra, 5.5,
#   5.4-mini and 5.3-codex-spark still listed.
codex_model    = "gpt-6-sol"          # owner's pick 2026-09-07 (run at medium effort)
codex_effort   = "medium"               # reasoning effort: minimal | low | medium | high | xhigh | max | ultra


# ── how many issues run at once ──────────────────────────────────────────────
[dispatch]
parallel = 6             # issues in flight (~3 agents each: 1 worker + 2 reviewers)
respect_dependencies = true
dependency_fail_closed = false
                         # false (shipped) → an unresolvable gh lookup dispatches the
                         # issue anyway, so a monitoring blip can never wedge the run.
                         # true → a blind gate HOLDS the tick instead. Set it per run
                         # (DUAL_AUTHOR_CONFIG) when dispatching over an open blocker is
                         # worse than stalling: on 2026-09-24 a proxy blip failed both
                         # halves of the gate at once and started three issues whose
                         # prerequisites had not merged.
                         # true → auto-dispatch SKIPS a queued issue that still has
                         # an OPEN blocker and dispatches the next unblocked entry
                         # instead. Blockers = GitHub's native issue dependencies
                         # (`gh api .../dependencies/blocked_by`) UNION the body
                         # convention "blocked by #123" / "Blocked by: #123" /
                         # "depends on #123" / "requires #123". A held entry STAYS
                         # in queue.txt (it is never popped) and goes as soon as its
                         # blockers close, so you can queue a whole dependency chain
                         # up front instead of hand-gating the file. Each hold shows
                         # in the dashboard activity feed as "held: blocked by #N".
                         # Fails OPEN by design: gh missing/unauthenticated/rate-
                         # limited/timed out → the issue dispatches anyway (with a
                         # one-off "dependency check unavailable" event), so this
                         # can never wedge the pipeline.
                         # false → strict FIFO as before; gate queue.txt yourself.
base_branch = ""         # branch lanes are cut from and PRs merge into; "" = the
                         # repo's default branch. Set it per repo (.dual-author.toml)
                         # to run an epic on an integration branch. Off the default
                         # branch the monitor pins each lane's gh-merge-base and
                         # closes the issue itself on merge (GitHub won't).
skip_labels = ["epic", "owner-step"]
                         # a queued issue carrying any of these labels is POPPED
                         # from queue.txt, never dispatched, with one feed line
                         # "#N skipped: labelled <label> (not for dual-author)". A
                         # queued PR number or CLOSED issue is popped the same way.
                         # Checked at dispatch whatever respect_dependencies says
                         # (one `gh api repos/{R}/issues/{N}`, cached 60s); a gh
                         # failure fails open like the blocker check (dispatches,
                         # says so once) unless dependency_fail_closed = true.
                         # [] disables the label half; PRs/closed are always skipped.


# ── the review panel ─────────────────────────────────────────────────────────
[review]
timeout_mins = 15        # per reviewer, per round

# Each [[review.reviewers]] is one reviewer. Order sets split placement
# (right, down, right, …). Any mix/count of codex + claude. A codex slot that is
# forced down (codex-down sentinel) or fails to spawn is auto-substituted with a
# fresh claude for that round, so a round is always decided.
[[review.reviewers]]
slot           = "codex"          # stable id used in file/agent names
tool           = "codex"
model          = "gpt-5.6-terra"  # 5.6 mid tier ("Balanced agentic coding model" per
                                  # `codex debug models`; sol=frontier, luna=fast/cheap)
codex_effort   = "high"
codex_sandbox  = "workspace-write"
codex_approval = "never"

[[review.reviewers]]
slot          = "claude"
tool          = "claude"
model         = "sonnet"                 # opus while its weekly cap has headroom; sonnet is the safe default
launch_prefix = ["teamclaude", "run", "--auto-fallback", "--"]

# Example — a third reviewer, or an all-claude panel (comment out the codex one):
# [[review.reviewers]]
# slot = "claude2"
# tool = "claude"
# model = "opus"
# effort = "high"


# ── what happens to a clean PR (WORKER step 4) ───────────────────────────────
[merge]
enabled       = true     # false → leave the PR marked ready but let a human merge
auto          = true     # true → `gh pr merge --auto` (merges once all checks pass)
                         # NB: on a repo with no CI there are no required checks, so
                         # --auto merges as soon as the PR is mergeable.
method        = "squash" # squash | merge | rebase
delete_branch = true


# ── monitor-owned workspace lifecycle ────────────────────────────────────────
# The watch/collect monitor performs these deterministic transitions itself, so
# the pipeline keeps moving even when the dispatcher LLM session is paused,
# compacted, or closed. Both were previously the dispatcher's job.
[lifecycle]
recycle  = true   # PR merged (gh ground truth) → close panes, unregister, remove
                  # the worktree workspace, delete the local branch
dispatch = true   # active < dispatch.parallel and queue.txt non-empty → cut a
                  # worktree off fresh main, launch the configured author with the
                  # issue brief, register, mark the issue in-progress (label+board).
                  # Needs `monitor.py set-root` run once at setup (from the repo).
                  # false → the dispatcher dispatches manually as before.


# ── monitor timing tunables (rarely need changing) ───────────────────────────
[timeouts]
reviewer_idle_sweep_secs    = 180    # idle reviewer pane closed after this
reviewer_unknown_sweep_secs = 600    # crashed/undetected reviewer reaped after this
codex_down_ttl_secs         = 5400   # codex-down sentinel self-expiry (90 min)
pr_poll_secs                = 60     # per-issue `gh pr` merged-state poll budget
